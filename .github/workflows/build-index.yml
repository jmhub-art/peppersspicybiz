name: Build Repo Index

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate INDEX.md
        run: |
          python -m pip install --upgrade pip
          python generate_repo_index.py --root . --output INDEX.md --title "Repository Index"

      - name: Commit & push changes
        run: |
          git config user.name "repo-index-bot"
          git config user.email "repo-index-bot@users.noreply.github.com"
          git add INDEX.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(index): auto-update INDEX.md"
            git push
          fi
